<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rocket Soccer 3D</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050509;
    font-family: Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#game {
    position: fixed;
    inset: 0;
    z-index: 0;
}

canvas {
    display: block;
}

/* ================= HUD ================= */

#hud {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    text-align: center;
    pointer-events: none;
    z-index: 10;
    text-shadow: 2px 3px 5px black;
}

#score {
    font-size: 28px;
    font-weight: 900;
}

#timer {
    margin-top: 4px;
    font-size: 20px;
    font-weight: bold;
}

/* ================= BOOST ================= */

#boostBox {
    position: fixed;
    right: 25px;
    bottom: 125px;
    width: 180px;
    height: 18px;
    border: 2px solid white;
    border-radius: 20px;
    background: #111;
    overflow: hidden;
    z-index: 10;
    pointer-events: none;
}

#boostFill {
    width: 100%;
    height: 100%;
    background: #ff8500;
}

/* ================= MENUS ================= */

.menu {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.78);

    z-index: 1000;

    pointer-events: auto;
    touch-action: auto;
}

.hidden {
    display: none !important;
}

.panel {
    width: min(90vw, 430px);
    padding: 35px;

    background: rgba(18,20,32,0.98);

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 22px;

    color: white;
    text-align: center;

    box-shadow:
        0 20px 70px rgba(0,0,0,0.7);
}

.panel h1 {
    margin: 0 0 8px;
    font-size: 40px;
}

.panel h2 {
    font-size: 32px;
}

.panel p {
    color: #bbb;
    margin-bottom: 25px;
}

.menuButton {
    position: relative;

    display: block;

    width: 100%;
    min-height: 55px;

    margin-top: 12px;

    border: none;
    border-radius: 14px;

    background: #168cff;
    color: white;

    font-size: 19px;
    font-weight: 900;

    cursor: pointer;

    pointer-events: auto;
    touch-action: manipulation;

    -webkit-user-select: none;
    user-select: none;
}

.menuButton:active {
    transform: scale(0.96);
}

#playButton {
    background: linear-gradient(
        135deg,
        #168cff,
        #0055ff
    );
}

/* ================= PAUSE ================= */

#pauseButton {
    position: fixed;

    top: 12px;
    right: 12px;

    width: 52px;
    height: 45px;

    border: none;
    border-radius: 12px;

    color: white;
    background: rgba(0,0,0,0.6);

    font-size: 22px;
    font-weight: bold;

    z-index: 20;

    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
}

/* ================= MOBILE ================= */

#mobileControls {
    position: fixed;
    inset: 0;

    z-index: 50;

    pointer-events: none;
}

#joystick {
    position: absolute;

    left: 20px;
    bottom: 25px;

    width: 145px;
    height: 145px;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,0.35);

    background: rgba(255,255,255,0.08);

    pointer-events: auto;
    touch-action: none;
}

#knob {
    position: absolute;

    left: 43px;
    top: 43px;

    width: 55px;
    height: 55px
