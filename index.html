<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Rocket Soccer 3D</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050509;
    font-family: Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

#game {
    width: 100vw;
    height: 100vh;
}

canvas {
    display: block;
}

.hidden {
    display: none !important;
}

/* ---------- HUD ---------- */

#hud {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    text-align: center;
    pointer-events: none;
    text-shadow: 2px 3px 5px #000;
    z-index: 5;
}

#score {
    font-size: 28px;
    font-weight: 900;
}

#timer {
    font-size: 20px;
    margin-top: 3px;
}

/* ---------- BOOST ---------- */

#boostBox {
    position: absolute;
    right: 25px;
    bottom: 125px;
    width: 180px;
    height: 18px;
    border: 2px solid white;
    border-radius: 12px;
    overflow: hidden;
    background: #111;
    z-index: 5;
}

#boostFill {
    width: 100%;
    height: 100%;
    background: #ff8a00;
    transition: width .08s linear;
}

/* ---------- MENUS ---------- */

.menu {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
    z-index: 20;
}

.panel {
    width: min(90%, 430px);
    padding: 35px;
    border-radius: 20px;
    background: rgba(20,20,30,.95);
    color: white;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,.6);
}

.panel h1 {
    font-size: 42px;
    margin: 0 0 10px;
}

.panel h2 {
    font-size: 32px;
}

.panel p {
    color: #ccc;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: #168cff;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

button:active {
    transform: scale(.97);
}

#pauseButton {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 55px;
    height: 45px;
    padding: 0;
    margin: 0;
    z-index: 10;
    background: rgba(0,0,0,.55);
}

/* ---------- MOBILE ---------- */

#mobileControls {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 8;
}

#joystick {
    position: absolute;
    left: 20px;
    bottom: 25px;
    width: 145px;
    height: 145px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.08);
    pointer-events: auto;
    touch-action: none;
}

#knob {
    position: absolute;
    width: 55px;
    height: 55px;
    left: 43px;
    top: 43px;
    border-radius: 50%;
    background: rgba(255,255,255,.55);
}

.action {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    pointer-events: auto;
    touch-action: none;
}

#jump {
    right: 115px;
    bottom: 30px;
    background: rgba(0,145,255,.75);
}

#boost {
    right: 20px;
    bottom: 30px;
    background: rgba(255,130,0,.8);
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <div id="score">BLUE 0 - 0 ORANGE</div>
    <div id="timer">03:00</div>
</div>

<div id="boostBox">
    <div id="boostFill"></div>
</div>

<button id="pauseButton">Ⅱ</button>

<div id="mobileControls">
    <div id="joystick">
        <div id="knob"></div>
    </div>

    <div id="jump" class="action">JUMP</div>
    <div id="boost" class="action">BOOST</div>
</div>

<!-- MAIN MENU -->

<div id="mainMenu" class="menu">
    <div class="panel">
        <h1>🚀 ROCKET SOCCER</h1>
        <p>3D arcade football</p>
        <button id="playButton">PLAY</button>
    </div>
</div>

<!-- PAUSE -->

<div id="pauseMenu" class="menu hidden">
    <div class="panel">
        <h1>PAUSED</h1>
        <button id="resumeButton">RESUME</button>
        <button id="restartButton">RESTART</button>
        <button id="menuButton">MAIN MENU</button>
    </div>
</div>

<!-- WIN -->

<div id="winMenu" class="menu hidden">
    <div class="panel">
        <h1 id="winnerText">BLUE WINS!</h1>
        <button id="againButton">PLAY AGAIN</button>
        <button id="winMenuButton">MAIN MENU</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
