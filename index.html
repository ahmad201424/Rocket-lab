<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Car Soccer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
  </style>
</head>
<body>
  <div id="ui">SCORE: <span id="score">0</span></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>

  <script>
    // Setup Three.js Scene, Camera, Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Setup Physics World
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);

    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(20, 40, 20);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // Ground Setup
    const groundMat = new CANNON.Material();
    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: groundMat });
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(groundBody);

    const groundMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 100),
      new THREE.MeshStandardMaterial({ color: 0x2e8b57 })
    );
    groundMesh.rotation.x = -Math.PI / 2;
    scene.add(groundMesh);

    // Ball Setup
    const ballRadius = 2;
    const ballBody = new CANNON.Body({ mass: 1, shape: new CANNON.Sphere(ballRadius) });
    ballBody.position.set(0, 5, 0);
    world.addBody(ballBody);

    const ballMesh = new THREE.Mesh(
      new THREE.SphereGeometry(ballRadius, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true })
    );
    scene.add(ballMesh);

    // Car Setup
    const carBody = new CANNON.Body({ mass: 150, shape: new CANNON.Box(new CANNON.Vec3(1.2, 0.6, 2)) });
    carBody.position.set(0, 1, 20);
    world.addBody(carBody);

    const carMesh = new THREE.Mesh(
      new THREE.BoxGeometry(2.4, 1.2, 4),
      new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    scene.add(carMesh);

    // Key Controls
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Game Loop
    function animate() {
      requestAnimationFrame(animate);
      world.fixedStep();

      // Simple Driving Logic
      const speed = 15;
      if (keys['w'] || keys['arrowup']) carBody.position.z -= 0.3;
      if (keys['s'] || keys['arrowdown']) carBody.position.z += 0.3;
      if (keys['a'] || keys['arrowleft']) carBody.position.x -= 0.3;
      if (keys['d'] || keys['arrowright']) carBody.position.x += 0.3;

      // Sync Meshes with Physics Bodies
      ballMesh.position.copy(ballBody.position);
      ballMesh.quaternion.copy(ballBody.quaternion);
      carMesh.position.copy(carBody.position);
      carMesh.quaternion.copy(carBody.quaternion);

      // Follow Camera
      camera.position.set(carBody.position.x, carBody.position.y + 6, carBody.position.z + 12);
      camera.lookAt(carBody.position);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
