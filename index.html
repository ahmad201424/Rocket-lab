<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Rocket Soccer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .touch-zone {
            position: absolute;
            bottom: 20px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
        }
        #joystick-zone { left: 20px; }
        #joystick-knob {
            position: absolute;
            top: 45px;
            left: 45px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }
        .btn {
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            touch-action: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #btn-boost { right: 20px; bottom: 30px; background: rgba(255, 140, 0, 0.7); }
        #btn-jump { right: 110px; bottom: 30px; background: rgba(0, 150, 255, 0.7); }
    </style>
    <!-- Three.js and Cannon.js for 3D physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">BLUE 0 - 0 ORANGE</div>
    
    <!-- Mobile Controls -->
    <div id="joystick-zone" class="touch-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="btn-jump" class="btn">JUMP</div>
    <div id="btn-boost" class="btn">BOOST</div>

    <script>
        // --- 1. SETUP THREE.JS & CANNON.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const world = new CANNON.World();
        world.gravity.set(0, -18.82, 0); // Dynamic gravity for arcade physics

        // Materials & Contact Physics
        const groundMat = new CANNON.Material();
        const ballMat = new CANNON.Material();
        const carMat = new CANNON.Material();

        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, ballMat, { friction: 0.3, restitution: 0.8 }));
        world.addContactMaterial(new CANNON.ContactMaterial(groundMat, carMat, { friction: 0.5, restitution: 0.1 }));
        world.addContactMaterial(new CANNON.ContactMaterial(ballMat, carMat, { friction: 0.2, restitution: 0.9 }));

        // --- 2. ARENA SETUP ---
        const arenaWidth = 60, arenaLength = 100, arenaHeight = 30;
        
        // Ground Mesh & Physics
        const floorGeo = new THREE.PlaneGeometry(arenaWidth, arenaLength);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        const groundBody = new CANNON.Body({ mass: 0, material: groundMat });
        groundBody.addShape(new CANNON.Plane());
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(groundBody);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 40, 0);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. BALL ---
        const ballRadius = 2.5;
        const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
        const ballMeshMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.3, roughness: 0.3 });
        const ballMesh = new THREE.Mesh(ballGeo, ballMeshMat);
        ballMesh.castShadow = true;
        scene.add(ballMesh);

        const ballBody = new CANNON.Body({
            mass: 1,
            material: ballMat,
            shape: new CANNON.Sphere(ballRadius),
            linearDamping: 0.1,
            angularDamping: 0.1
        });
        ballBody.position.set(0, 10, 0);
        world.addBody(ballBody);

        // --- 4. CAR ---
        const carGeo = new THREE.BoxGeometry(2.5, 1.2, 4.5);
        const carMeshMat = new THREE.MeshStandardMaterial({ color: 0x0088ff });
        const carMesh = new THREE.Mesh(carGeo, carMeshMat);
        carMesh.castShadow = true;
        scene.add(carMesh);

        const carBody = new CANNON.Body({
            mass: 15,
            material: carMat,
            shape: new CANNON.Box(new CANNON.Vec3(1.25, 0.6, 2.25)),
            linearDamping: 0.4,
            angularDamping: 0.6
        });
        carBody.position.set(0, 2, 30);
        world.addBody(carBody);

        // --- 5. TOUCH & JOYSTICK CONTROLS ---
        let joystickVector = { x: 0, y: 0 };
        let isBoosting = false;
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');

        joystickZone.addEventListener('touchstart', handleJoystick);
        joystickZone.addEventListener('touchmove', handleJoystick);
        joystickZone.addEventListener('touchend', () => {
            joystickVector = { x: 0, y: 0 };
            joystickKnob.style.top = '45px';
            joystickKnob.style.left = '45px';
        });

        function handleJoystick(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const distance = Math.min(Math.hypot(dx, dy), 50);
            const angle = Math.atan2(dy, dx);

            joystickVector.x = (distance / 50) * Math.cos(angle);
            joystickVector.y = (distance / 50) * Math.sin(angle);

            joystickKnob.style.left = `${45 + joystickVector.x * 35}px`;
            joystickKnob.style.top = `${45 + joystickVector.y * 35}px`;
        }

        // Jump & Boost Buttons
        const btnJump = document.getElementById('btn-jump');
        const btnBoost = document.getElementById('btn-boost');

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
        btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
        btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; });

        function jump() {
            // Check if car is close to the ground
            if (carBody.position.y < 1.5) {
                carBody.velocity.y = 12;
            }
        }

        // Keyboard Controls Fallback for PC Testing
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // --- 6. GAME LOOP & PHYSICS UPDATE ---
        const timeStep = 1 / 60;
        let blueScore = 0, orangeScore = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Process Drive Inputs
            let moveForward = -joystickVector.y;
            let turnKey = -joystickVector.x;

            if (keys['w'] || keys['arrowup']) moveForward = 1;
            if (keys['s'] || keys['arrowdown']) moveForward = -1;
            if (keys['a'] || keys['arrowleft']) turnKey = 1;
            if (keys['d'] || keys['arrowright']) turnKey = -1;
            if (keys[' ']) jump();
            isBoosting = isBoosting || keys['shift'];

            // Apply Car Movement
            const driveSpeed = isBoosting ? 40 : 20;
            const turnSpeed = 2.5;

            // Rotation
            if (turnKey !== 0) {
                carBody.angularVelocity.y = turnKey * turnSpeed;
            }

            // Forward/Backward Force
            const forwardVector = new CANNON.Vec3(0, 0, -1);
            const rotatedVector = carBody.quaternion.vmult(forwardVector);
            
            if (moveForward !== 0 || isBoosting) {
                const force = (moveForward || (isBoosting ? 1 : 0)) * driveSpeed;
                carBody.velocity.x = rotatedVector.x * force;
                carBody.velocity.z = rotatedVector.z * force;
            }

            // Step Physics
            world.step(timeStep);

            // Sync Visuals with Physics Bodies
            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            carMesh.position.copy(carBody.position);
            carMesh.quaternion.copy(carBody.quaternion);

            // Camera Tracking Behind Car
            const cameraOffset = new THREE.Vector3(0, 6, 14);
            cameraOffset.applyQuaternion(carMesh.quaternion);
            camera.position.copy(carMesh.position).add(cameraOffset);
            camera.lookAt(carMesh.position.clone().add(new THREE.Vector3(0, 2, 0)));

            // Goal Logic
            if (Math.abs(ballBody.position.z) > arenaLength / 2) {
                if (ballBody.position.z < 0) blueScore++;
                else orangeScore++;
                
                document.getElementById('ui').innerText = `BLUE ${blueScore} - ${orangeScore} ORANGE`;
                
                // Reset Positions
                ballBody.position.set(0, 5, 0);
                ballBody.velocity.set(0, 0, 0);
                ballBody.angularVelocity.set(0, 0, 0);
                carBody.position.set(0, 2, 30);
                carBody.velocity.set(0, 0, 0);
            }

            renderer.render(scene, camera);
        }

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
